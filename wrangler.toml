name = "lof-smart-monitor"
main = "lof-smart-monitor-worker.js"
compatibility_date = "2026-06-02"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[triggers]
crons = [
  "30 23 * * 0-4",    # 北京时间7:30 数据更新（UTC周日-周四23:30）
  "0 10 * * 1-5",     # 北京时间18:00 数据更新（UTC周一-周五10:00）
  "1-59/5 * * * 1-5"  # 交易时间每5分钟监控
]

[[kv_namespaces]]
binding = "FUNDS_KV"
id = "0d6d2904a8aa4a859e91292d1fd9f1e2"

# 敏感变量（通过 wrangler secret 设置）
# FEISHU_WEBHOOK: 飞书Webhook地址
# GITHUB_TOKEN: GitHub Personal Access Token，用于推送funds.json到仓库
