name = "lof-smart-monitor"
main = "lof-smart-monitor-worker.js"
compatibility_date = "2026-06-02"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[kv_namespaces]]
binding = "FUNDS_KV"
id = "0d6d2904a8aa4a859e91292d1fd9f1e2"

# Cron triggers (需在 Cloudflare Dashboard 手动配置):
# - 溢价监控: */5 * * * 1-5 (交易日每5分钟)
# - 申购状态同步 7:00: 0 23 * * 7,1,2,3,4 (UTC 23:00 = 北京时间 7:00)
# - 申购状态同步 20:00: 0 12 * * 1-5 (UTC 12:00 周一~周五 = 北京时间 20:00 周一~周五)
#
# GitHub Actions 数据更新:
# - 4:00 (UTC 20:00 周日~周四) 和 20:00 (UTC 12:00 周一~周五)

# 敏感变量（通过 wrangler secret 设置）
# FEISHU_WEBHOOK: 飞书Webhook地址