name = "lof-smart-monitor"
main = "lof-smart-monitor-worker.js"
compatibility_date = "2026-06-02"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[kv_namespaces]]
binding = "FUNDS_KV"
id = "0d6d2904a8aa4a859e91292d1fd9f1e2"

# Cron triggers are configured manually in Cloudflare Dashboard
# - Premium monitor: */5 * * * 1-5 (every 5 minutes on trading days)
# - Data sync at 7:00 AM: 0 23 * * 0-4 (UTC 23:00 Sun-Thu = Beijing 7:00 Mon-Fri)
#
# Data update is handled by GitHub Actions:
# - 4:00 AM (UTC 20:00 Sun-Thu) and 8:00 PM (UTC 12:00 Mon-Fri)

# 敏感变量（通过 wrangler secret 设置）
# FEISHU_WEBHOOK: 飞书Webhook地址
