<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer-when-downgrade">
<title>LOF Monitor</title>
<style>
/* ===== Reset & Base ===== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px;scroll-behavior:smooth}

:root {
  --bg-primary: #0b0f1a;
  --bg-secondary: #111827;
  --bg-card: #1a2236;
  --bg-hover: #1e2a45;
  --bg-active: #243056;
  --border-color: #2a3456;
  --border-light: #38406a;
  --text-primary: #e8ecf4;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --gray: #64748b;
  --accent-blue: #3b82f6;
  --accent-blue-hover: #60a5fa;
  --accent-blue-dim: rgba(59,130,246,0.12);
  --up: #22c55e;
  --up-bg: rgba(34,197,94,0.1);
  --up-border: rgba(34,197,94,0.25);
  --down: #ef4444;
  --down-bg: rgba(239,68,68,0.1);
  --down-border: rgba(239,68,68,0.25);
  --warning: #f59e0b;
  --warning-bg: rgba(245,158,11,0.1);
  --warning-border: rgba(245,158,11,0.25);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --shadow-card: 0 4px 20px rgba(0,0,0,0.3);
  --transition: all 0.2s ease;
  --sidebar-width: 210px;
}

body {
  font-family: var(--font);
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ===== Scrollbar ===== */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg-secondary)}
::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--border-light)}

/* ===== Layout ===== */
.app-layout {
  display: flex;
  min-height: 100vh;
}

/* ===== Sidebar ===== */
.sidebar {
  width: var(--sidebar-width);
  background: var(--bg-secondary);
  border-right: 1px solid var(--border-color);
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  z-index: 100;
  overflow-y: auto;
}

.sidebar-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 18px 16px 14px;
  border-bottom: 1px solid var(--border-color);
}

.sidebar-logo .logo-icon {
  width: 28px;
  height: 28px;
  background: linear-gradient(135deg, var(--accent-blue), #6366f1);
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  font-weight: 800;
  color: #fff;
  flex-shrink: 0;
}

.sidebar-logo .logo-text {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-primary);
}

.sidebar-logo .logo-text span { color: var(--accent-blue); }

/* Sidebar Stats */
.sidebar-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 14px 14px 10px;
}

.sidebar-stat {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  padding: 10px;
  text-align: center;
  transition: var(--transition);
  cursor: pointer;
}

.sidebar-stat:hover {
  border-color: var(--border-light);
}

.sidebar-stat .stat-num {
  font-size: 1.15rem;
  font-weight: 700;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}
.sidebar-stat .stat-num.up{color:var(--up)}
.sidebar-stat .stat-num.down{color:var(--down)}
.sidebar-stat .stat-num.neutral{color:var(--text-primary)}
.sidebar-stat .stat-num.accent{color:var(--accent-blue)}

.sidebar-stat .stat-label {
  font-size: 0.6rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.3px;
  margin-top: 2px;
}

/* Sidebar Section */
.sidebar-section {
  padding: 10px 14px 4px;
}

.sidebar-section-title {
  font-size: 0.62rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  font-weight: 600;
  margin-bottom: 8px;
  padding: 0 4px;
}

.sidebar-nav-group {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.filter-tab {
  display: block;
  width: 100%;
  padding: 8px 12px;
  border: none;
  border-radius: var(--radius-sm);
  background: transparent;
  font-size: 0.8rem;
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
  outline: none;
  font-weight: 500;
  font-family: var(--font);
  text-align: left;
}

.filter-tab:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.filter-tab.active {
  background: var(--accent-blue-dim);
  color: var(--accent-blue);
  border-left: 3px solid var(--accent-blue);
  font-weight: 600;
}

.sidebar-divider {
  border: none;
  border-top: 1px solid var(--border-color);
  margin: 8px 14px;
}

/* ===== Content Area ===== */
.content-area {
  flex: 1;
  margin-left: var(--sidebar-width);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.top-bar {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 16px 24px 0;
  gap: 12px;
}

.generate-time {
  font-size: 0.75rem;
  color: var(--text-muted);
  background: var(--bg-card);
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-color);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.main-container {
  max-width: 100%;
  padding: 16px 24px 24px;
}

/* ===== Table ===== */
.fund-table-container {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-card);
}

.fund-table {
  width: 100%;
  border-collapse: collapse;
}

.fund-table th {
  background: var(--bg-secondary);
  color: var(--text-muted);
  padding: 12px 10px;
  text-align: center;
  font-weight: 600;
  font-size: 0.73rem;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  cursor: pointer;
  transition: var(--transition);
  vertical-align: middle;
  border-bottom: 2px solid var(--border-color);
  font-family: var(--font);
  white-space: nowrap;
  user-select: none;
  position: relative;
}

.fund-table th:hover {
  color: var(--text-secondary);
  background: var(--bg-hover);
}

.fund-table th.sorted {
  color: var(--accent-blue);
  background: var(--accent-blue-dim);
}

.fund-table th.sorted::after {
  content: ' \25B2';
  font-size: 0.6rem;
  opacity: 0.7;
}

.fund-table td {
  padding: 10px 10px;
  border-bottom: 1px solid rgba(42,52,86,0.5);
  font-size: 0.82rem;
  text-align: center;
  vertical-align: middle;
  color: var(--text-primary);
  font-family: var(--font);
  transition: background 0.15s ease;
}

.fund-table tr:last-child td { border-bottom: none; }
.fund-table tr { cursor: pointer; }
.fund-table tr:hover td { background: rgba(59,130,246,0.04); }

.fund-table th:nth-child(1), .fund-table td:nth-child(1) { width: 44px; min-width: 44px; }
.fund-table th:nth-child(2), .fund-table td:nth-child(2) { min-width: 110px; }
.fund-table th:nth-child(3), .fund-table td:nth-child(3) { min-width: 90px; }
.fund-table th:nth-child(4), .fund-table td:nth-child(4) { min-width: 80px; }
.fund-table th:nth-child(5), .fund-table td:nth-child(5) { min-width: 95px; }
.fund-table th:nth-child(6), .fund-table td:nth-child(6) { min-width: 82px; }
.fund-table th:nth-child(7), .fund-table td:nth-child(7) { max-width: 165px; white-space: normal; word-wrap: break-word; font-size: 0.7rem; line-height: 1.3; }
.fund-table th:nth-child(8), .fund-table td:nth-child(8) { min-width: 95px; }
.fund-table th:nth-child(9), .fund-table td:nth-child(9) { min-width: 75px; }

/* ===== Code Cell ===== */
.code-cell { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.code-cell .fund-name { font-weight: 500; color: var(--text-primary); font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 110px; }
.code-cell .fund-code { font-size: 0.65rem; color: var(--text-muted); font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', monospace; letter-spacing: 0.3px; }

/* ===== Price & Premium Colors ===== */
.price-change { font-weight: 600; font-size: 0.78rem; margin-top: 2px; }
.price-change.red, .premium-rate.red { color: var(--down); }
.price-change.green, .premium-rate.green { color: var(--up); }
.premium-rate { display: block; font-weight: 700; font-size: 0.9rem; }
.premium-rate.red { color: var(--down); }
.premium-rate.green { color: var(--up); }

/* ===== Quota Badges ===== */
.quota-status { display: inline-block; padding: 3px 12px; border-radius: 12px; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.2px; }
.quota-status.open { background: var(--up-bg); color: var(--up); border: 1px solid var(--up-border); }
.quota-status.limited { background: var(--warning-bg); color: var(--warning); border: 1px solid var(--warning-border); }
.quota-status.suspended { background: var(--down-bg); color: var(--down); border: 1px solid var(--down-border); }

/* ===== Zero Change ===== */
.zero-change { display: inline-block; padding: 3px 12px; border-radius: 12px; background: rgba(100,116,139,0.08); color: var(--text-muted); border: 1px solid rgba(100,116,139,0.15); font-weight: 500; font-size: 0.78rem; }

/* ===== Loading ===== */
.loading { display: flex; align-items: center; justify-content: center; padding: 60px 20px; color: var(--text-muted); font-size: 0.9rem; font-weight: 500; gap: 14px; }
.loading::after { content: ''; width: 20px; height: 20px; border: 2px solid var(--border-color); border-top-color: var(--accent-blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Footer ===== */
.footer { margin-top: 0; border-top: 1px solid var(--border-color); background: var(--bg-secondary); }
.footer-content { max-width: 100%; margin: 0 auto; padding: 16px 24px; display: flex; align-items: center; justify-content: center; text-align: center; }
.footer-info { font-size: 0.7rem; color: var(--text-muted); line-height: 1.8; }

/* ===== Mobile Menu Button ===== */
.mobile-menu-btn {
  display: none;
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 101;
  width: 40px;
  height: 40px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  color: var(--text-primary);
  font-size: 1.2rem;
  cursor: pointer;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}
.mobile-menu-btn:hover { background: var(--bg-hover); }
.mobile-menu-btn:active { transform: scale(0.95); }

/* ===== Sidebar Overlay (mobile drawer) ===== */
.sidebar-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 99;
}
.sidebar-overlay.active { display: block; }

/* ===== Responsive ===== */
/* 平板：侧边栏缩为图标模式 */
@media (max-width: 900px) {
  .sidebar { width: 48px; }
  .sidebar-logo .logo-text, .sidebar-stat .stat-label, .sidebar-section-title, .filter-tab { display: none; }
  .sidebar-stat { padding: 6px; }
  .sidebar-stat .stat-num { font-size: 0.85rem; }
  .sidebar-logo { justify-content: center; padding: 12px 0; }
  .sidebar-section { padding: 6px 4px; }
  .filter-tab { padding: 10px 0; text-align: center; }
  .filter-tab.active { border-left: 3px solid var(--accent-blue); }
  .content-area { margin-left: 48px; }
  .top-bar { padding: 12px 14px 0; }
  .main-container { padding: 12px 14px 16px; }
  .fund-table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .fund-table { min-width: 780px; }
  .fund-table th, .fund-table td { padding: 8px 6px; font-size: 0.72rem; }
}

/* 大手机/小平板：侧边栏改为抽屉式 */
@media (max-width: 680px) {
  .mobile-menu-btn { display: flex; }
  .sidebar {
    transform: translateX(-100%);
    transition: transform 0.3s ease;
    width: 200px;
    z-index: 100;
    box-shadow: 4px 0 24px rgba(0,0,0,0.4);
  }
  .sidebar.open { transform: translateX(0); }
  /* 恢复侧边栏完整显示（抽屉打开时） */
  .sidebar .logo-text, .sidebar .stat-label, .sidebar-section-title, .filter-tab { display: block; }
  .sidebar-logo { justify-content: flex-start; padding: 18px 16px 14px; }
  .sidebar-stat { padding: 10px; }
  .sidebar-stat .stat-num { font-size: 1.15rem; }
  .sidebar-section { padding: 10px 14px 4px; }
  .filter-tab { padding: 8px 12px; text-align: left; }

  .content-area { margin-left: 0; }
  .top-bar { padding: 10px 12px 0; padding-left: 60px; }
  .main-container { padding: 10px 12px 12px; }

  .fund-table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--radius-md); }
  .fund-table { min-width: 720px; }
  .fund-table th, .fund-table td { padding: 8px 5px; font-size: 0.7rem; }
  .generate-time { font-size: 0.65rem; padding: 4px 8px; }

  /* 模态窗口全屏化 */
  .modal-overlay { align-items: flex-end; }
  .modal-box {
    width: 100vw;
    max-width: 100vw;
    max-height: 92vh;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    padding: 16px 16px 14px;
  }
}

/* 手机：进一步紧凑 */
@media (max-width: 480px) {
  .top-bar { padding: 8px 10px 0; padding-left: 56px; }
  .main-container { padding: 8px 8px 10px; }
  .fund-table { min-width: 680px; }
  .fund-table th, .fund-table td { padding: 6px 4px; font-size: 0.65rem; }
  .code-cell .fund-name { font-size: 0.7rem; max-width: 90px; }
  .code-cell .fund-code { font-size: 0.6rem; }
  .modal-box { padding: 14px 12px 12px; max-height: 90vh; }
  .modal-header { margin-bottom: 12px; }
  .modal-title { font-size: 0.95rem; }
  .modal-close { width: 28px; height: 28px; font-size: 1rem; }
  .modal-legend { gap: 12px; font-size: 0.7rem; margin-top: 8px; }
  .modal-nav-note { font-size: 0.62rem; }
  .footer-info { font-size: 0.62rem; line-height: 1.6; }
}
/* ===== 净值曲线模态窗口 ===== */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.65);
  z-index: 1000;
  justify-content: center;
  align-items: center;
}
.modal-overlay.active { display: flex; }
.modal-box {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  width: 90vw;
  max-width: 780px;
  max-height: 85vh;
  padding: 24px 28px 20px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.modal-title {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text-primary);
}
.modal-title .modal-code {
  color: var(--accent-blue);
  font-weight: 600;
}
.modal-close {
  width: 32px; height: 32px;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  background: transparent;
  color: var(--text-muted);
  font-size: 1.1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}
.modal-close:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}
.modal-body {
  flex: 1;
  min-height: 0;
  position: relative;
}
.modal-body canvas {
  width: 100%;
  height: 100%;
  display: block;
}
.modal-legend {
  display: flex;
  gap: 20px;
  justify-content: center;
  margin-top: 12px;
  font-size: 0.78rem;
  color: var(--text-secondary);
}
.modal-legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.modal-legend-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  display: inline-block;
}
.modal-legend-dot.est { background: var(--accent-blue); }
.modal-legend-dot.actual { background: #f59e0b; }
.modal-loading {
  text-align: center;
  color: var(--text-muted);
  padding: 60px 0;
  font-size: 0.85rem;
}
.modal-no-data {
  text-align: center;
  color: var(--text-muted);
  padding: 60px 0;
  font-size: 0.85rem;
}
.modal-nav-note {
  text-align: center;
  font-size: 0.68rem;
  color: var(--text-muted);
  margin-top: 6px;
}
</style>
</head>
<body>

<!-- 移动端菜单按钮 -->
<button class="mobile-menu-btn" onclick="toggleSidebar(event)" aria-label="菜单">☰</button>
<!-- 侧边栏遮罩层（移动端） -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<div class="app-layout">

<!-- ===== Left Sidebar ===== -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">LF</div>
    <div class="logo-text"><span>LOF</span> Monitor</div>
  </div>

  <div class="sidebar-stats">
    <div class="sidebar-stat" onclick="setFilter('all')">
      <div class="stat-num neutral" id="statTotal">-</div>
      <div class="stat-label">全部</div>
    </div>
    <div class="sidebar-stat" onclick="setFilter('premium')">
      <div class="stat-num up" id="statPremium">-</div>
      <div class="stat-label">溢价</div>
    </div>
    <div class="sidebar-stat" onclick="setFilter('discount')">
      <div class="stat-num down" id="statDiscount">-</div>
      <div class="stat-label">折价</div>
    </div>
    <div class="sidebar-stat" onclick="setFilter('arbitrage')">
      <div class="stat-num accent" id="statArbitrage">-</div>
      <div class="stat-label">套利</div>
    </div>
  </div>

  <hr class="sidebar-divider">

  <div class="sidebar-section">
    <div class="sidebar-section-title">类型筛选</div>
    <div class="sidebar-nav-group">
      <button class="filter-tab active" onclick="setFilter('all')">全部</button>
      <button class="filter-tab" onclick="setFilter('arbitrage')">套利机会</button>
      <button class="filter-tab" onclick="setFilter('premium')">溢价基金</button>
      <button class="filter-tab" onclick="setFilter('discount')">折价基金</button>
    </div>
  </div>

  <hr class="sidebar-divider">

  <div class="sidebar-section">
    <div class="sidebar-section-title">类别筛选</div>
    <div class="sidebar-nav-group">
      <button class="filter-tab active" onclick="setCategory('all')">全类别</button>
      <button class="filter-tab" onclick="setCategory('us')">美股</button>
      <button class="filter-tab" onclick="setCategory('hk')">港股</button>
      <button class="filter-tab" onclick="setCategory('cm')">商品</button>
      <button class="filter-tab" onclick="setCategory('cn')">A股</button>
    </div>
  </div>
</aside>

<!-- ===== Right Content ===== -->
<div class="content-area">

  <div class="top-bar">
    <div id="generate-time" class="generate-time">数据加载中...</div>
  </div>

  <main class="main-container">
    <div class="fund-table-container">
      <table class="fund-table desktop-table">
        <thead>
          <tr>
            <th onclick="sortTable('index')">#</th>
            <th onclick="sortTable('code')">代码</th>
            <th onclick="sortTable('price')">场内价格</th>
            <th onclick="sortTable('nav')">预估净值</th>
            <th onclick="sortTable('officialNav')">T-1净值</th>
            <th onclick="sortTable('premium')" class="sorted">溢价率</th>
            <th>基金参考指数</th>
            <th>指数涨跌幅</th>
            <th onclick="sortTable('quota')">申购限额</th>
          </tr>
        </thead>
        <tbody id="fundTableBodyDesktop">
          <tr>
            <td colspan="9" class="loading">加载中...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <div class="footer-info">
        LOF Monitor · 实时溢价监控 · 数据来源：腾讯财经 · 天天基金 · 东方财富 · &copy; 2026
      </div>
    </div>
  </footer>

</div>
</div>

<script>
let FUNDS = [];
let BENCH = {};
let INDEX_NAMES = {};
let ALL_TQ_CODES = [];

async function loadFundsData() {
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 10000);
    const response = await fetch('./data/funds.json?' + Date.now(), { signal: controller.signal });
    clearTimeout(timeout);
    const data = await response.json();
    
    FUNDS = data.funds || [];

const Cache = {
  get(key) {
    try {
      const item = localStorage.getItem(key);
      if (!item) return null;
      const parsed = JSON.parse(item);
      if (parsed.expiry && Date.now() > parsed.expiry) {
        localStorage.removeItem(key);
        return null;
      }
      return parsed.data;
    } catch (e) {
      return null;
    }
  },
  set(key, data, expiryHours = 1) {
    try {
      const item = {
        data,
        expiry: Date.now() + (expiryHours * 60 * 60 * 1000)
      };
      localStorage.setItem(key, JSON.stringify(item));
    } catch (e) {
    }
  },
  remove(key) {
    try {
      localStorage.removeItem(key);
    } catch (e) {
    }
  }
};

// 时间戳转北京日期字符串（东方财富时间戳是北京时间午夜，UTC会少一天）
function toBeijingDate(ts) {
  const d = new Date(ts);
  const offset = 8 * 60 * 60 * 1000; // UTC+8
  return new Date(d.getTime() + offset).toISOString().slice(0, 10);
}

// 接口① pingzhongdata.js —— 东方财富JS文件（允许跨域，第三方广泛使用）
function fetchNavFromPingzhong(fund) {
  return new Promise(resolve => {
    const cb = 'pzd' + Date.now() + '_' + fund.code;
    let done = false;
    const timer = setTimeout(() => {
      if (!done) {
        done = true;
        delete window[cb];
        resolve(null);
      }
    }, 8000);
    // pingzhongdata 不是jsonp，直接执行JS并赋值全局变量
    // 需要用script标签加载后读取全局 Data_netWorthTrend
    const s = document.createElement('script');
    s.onload = () => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      try {
        // 优先读 Data_netWorthTrend（单位净值）
        // 若y值异常偏大（>50），说明该字段存的不是单位净值，改读 Data_ACWorthTrend
        let nav = null, dt = '';
        const arr = window['Data_netWorthTrend'];
        if (arr && arr.length > 0) {
          const last = arr[arr.length - 1];
          const v = parseFloat(last.y || last[1]);
          if (v > 0 && v <= 50) {
            nav = v;
            dt = last.x ? toBeijingDate(last.x) : '';
          }
        }
        // Data_netWorthTrend异常时，读 Data_ACWorthTrend（累计净值，对白银/商品LOF等同单位净值）
        if (!nav) {
          const arr2 = window['Data_ACWorthTrend'];
          if (arr2 && arr2.length > 0) {
            const last2 = arr2[arr2.length - 1];
            // 格式：[时间戳, 净值] 数组
            const v2 = parseFloat(Array.isArray(last2) ? last2[1] : last2.y);
            const ts = Array.isArray(last2) ? last2[0] : last2.x;
            dt = ts ? toBeijingDate(ts) : '';
            if (v2 > 0) {
              nav = v2;
            }
          }
        }
        if (nav) {
          resolve({ nav, date: dt });
        } else {
          resolve(null);
        }
      } catch (e) {
        resolve(null);
      } finally {
        s.remove();
        delete window['Data_netWorthTrend'];
        delete window['Data_ACWorthTrend'];
      }
    };
    s.onerror = () => {
      if (!done) {
        done = true;
        clearTimeout(timer);
        s.remove();
        resolve(null);
      }
    };
    s.src = `https://fund.eastmoney.com/pingzhongdata/${fund.code}.js?v=${Date.now()}`;
    document.head.appendChild(s);
  });
}

// 并行跑两个接口，取日期较新的净值
async function fetchNavFromEM(fund) {
  // 先检查缓存
  const cached = Cache.get(`nav_${fund.ocode}`);
  
  const [r1, r2] = await Promise.all([fetchNavFromPingzhong(fund), fetchNavFromLsjz(fund)]);
  if (!r1 && !r2) {
    return cached || null;
  }
  
  let bestResult;
  if (!r1) {
    bestResult = r2;
  } else if (!r2) {
    bestResult = r1;
  } else {
    // 两个都有数据，取日期较新的
    const d1 = r1.date || '', d2 = r2.date || '';
    if (d2 > d1) {
      bestResult = r2;
    } else {
      bestResult = r1; // 日期相同或pingzhongdata更新，用r1
    }
  }
  
  // 比较新数据与缓存数据的日期，如果新数据更新则使用新数据
  if (cached) {
    const cachedDate = cached.date || '';
    const newDate = bestResult.date || '';
    if (newDate > cachedDate) {
      // 新数据日期更新，使用新数据并更新缓存
      Cache.set(`nav_${fund.ocode}`, bestResult);
      return bestResult;
    } else {
      // 缓存数据日期更新，使用缓存数据
      return cached;
    }
  } else {
    // 没有缓存数据，使用新数据并缓存
    Cache.set(`nav_${fund.ocode}`, bestResult);
    return bestResult;
  }
}

    results.forEach((result, index) => {

      if (result && result.nav > 0) {
        fund.officialNav = result.nav;
        fund.navDate = result.date;
        loaded++;
      }
    });
  }
  
  navLoaded = true;
}

function fetchEastmoney() {

    'csi930917': '2.930917',  // 中证沪港深高股息指数 CSI930917（501307银河高股息）
    'csi930914': '2.930914',  // 中证港股通高股息投资指数 CSI930914（501305/501306）

    'sh000985':  '1.000985',  // 中证综合债券指数（501312海外科技LOF业绩基准10%分量）
    'sh000066':  '1.000066',  // 上证大宗商品股票指数（161715招商中证大宗商品）
    'sh000945':  '1.000945',  // 中证上游资源产业指数（161217国投瑞银上游资源）
    'hkHSMI':    '124.HSMI',  // 恒生综合中型股指数（501303恒生中型股LOF）
    'hkHSSI':    '124.HSSI',  // 恒生综合小型股指数（161124港股小盘LOF）
    'hkHSCI':    '124.HSCI',  // 恒生综合指数（160322港股精选LOF）
    'hkHSI':     '124.HSI',   // 恒生指数（hkHSMI/hkHSSI/hkHSCI降级后备）
    'nf_AG0':    '113.agm',   // 沪银主连（上期所market=113，注意前一次用8.AG888是错误代码）
  };
  const prefix = '_em_' + Date.now();
  let pending = Object.keys(EM_CODES).length;
  const out = {};
  const times = {};
  return new Promise(resolve => {
    Object.entries(EM_CODES).forEach(([key, secid]) => {
      const cb = prefix + '_' + key;
      const timer = setTimeout(() => {
        if (window[cb]) { delete window[cb]; pending--; if (pending <= 0) resolve({ data: out, times }); }
      }, 8000);
      window[cb] = function(d) {
        clearTimeout(timer);
        delete window[cb];
        if (d && d.data) {
          // f3=涨跌幅百分比（如-0.02表示-0.02%），f170=涨跌点数（需除以100）
          const chg = d.data.f3 !== undefined ? d.data.f3 : ((d.data.f170 || 0) / (d.data.f43 || 100) * 100);
          const time = d.data.f14 || '';
          out[key] = chg;
          times[key] = time;
        }
        pending--;
        if (pending <= 0) resolve({ data: out, times });
      };
      const s = document.createElement('script');
      s.src = `https://push2.eastmoney.com/api/qt/stock/get?secid=${secid}&fields=f43,f169,f170,f3,f14&cb=${cb}&_=${Date.now()}`;
      s.onerror = function() { clearTimeout(timer); if (window[cb]) delete window[cb]; pending--; if (pending <= 0) resolve({ data: out, times }); };
      document.head.appendChild(s);
    });
  });
}

        const data = window[`v_${indexCode}`];
        if (!data || data.length < 5) return;
        
        const parts = data.split('~');
        const price = parseFloat(parts[3]);
        const prevClose = parseFloat(parts[4]);
        const time = parts[30] || parts[29] || ''; // 尝试获取时间信息
        
        if (price > 0) {
          result.indices[indexCode] = {
            price,
            change: prevClose > 0 ? (price - prevClose) / prevClose * 100 : 0,
            time: time
          };
        }
      });
      
      script.remove();
      resolve(result);
    };
    
    script.onerror = () => {
      if (!done) {
        done = true;
        clearTimeout(timer);
        console.log('腾讯脚本加载失败');
        script.remove();
        resolve({ funds: {}, indices: {} });
      }
    };
    
    script.src = `https://qt.gtimg.cn/q=${codes}&_=${Date.now()}`;
    document.head.appendChild(script);
  });
}

// 通过 Pages Function 服务端代理获取沪银主连期货数据
// 浏览器端直接获取期货Data受CORS/Referer限制，服务端无此限制
async function fetchFuturesFromProxy() {
  try {
    const res = await fetch('/api/futures?_=' + Date.now(), { cache: 'no-cache' });
    if (res.ok) {
      const data = await res.json();
      console.log('[期货代理] 响应:', JSON.stringify(data));
      if (data && data.nf_AG0 !== null && data.nf_AG0 !== undefined) {
        return { nf_AG0: data.nf_AG0 };
      }
      console.warn('[期货代理] 返回null，数据源:', data.source, data.raw_text ? '原始片段:' + data.raw_text.substring(0,100) : '');
    } else {
      console.warn('[期货代理] HTTP错误:', res.status);
    }
  } catch (e) {
    console.log('[期货代理] 请求失败:', e);
  }
  return {};
}

// 刷新数据
async function refreshData() {
  // 刷新锁，防止并发调用
  if (isRefreshing) return;
  isRefreshing = true;
  
  // 更新数据时间戳
  dataTimestamp = new Date();
  
  // 净值加载不阻塞市场数据获取，后台异步运行
  const navPromise = loadNavs().catch(e => console.log('净值加载异常:', e));
  
  // 并行获取腾讯财经、东方财富（JSONP）和期货代理数据
  const [tencentData, emResult, futuresResult] = await Promise.all([fetchTencentData(), fetchEastmoney(), fetchFuturesFromProxy()]);
  const emIdx = emResult.data;
  const emTimes = emResult.times;
  
  // 缓存外盘指数涨跌幅和时间信息（腾讯qt + 东方财富）
  indexData = {};
  indexTimes = {};
  Object.entries(tencentData.indices).forEach(([code, d]) => {
    indexData[code] = d.change;
    indexTimes[code] = d.time || '';
  });
  Object.entries(emIdx).forEach(([code, chg]) => {
    // 仅当东财返回有效涨跌幅时才覆盖腾讯数据（非交易时段东财可能返回null）
    if (chg != null) {
      indexData[code] = chg;
    }
    if (emTimes[code]) {
      // 处理东方财富返回的时间格式
      indexTimes[code] = emTimes[code];
    } else {
      // 没有时间信息，使用当前时间
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hour = String(now.getHours()).padStart(2, '0');
      const minute = String(now.getMinutes()).padStart(2, '0');
      indexTimes[code] = `${year}-${month}-${day} ${hour}:${minute}`;
    }
  });
  
  // 合并期货代理数据（nf_AG0沪银主连）
  Object.entries(futuresResult).forEach(([code, chg]) => {
    indexData[code] = chg;
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    const hour = String(now.getHours()).padStart(2, '0');
    const minute = String(now.getMinutes()).padStart(2, '0');
    indexTimes[code] = `${year}-${month}-${day} ${hour}:${minute}`;
  });
  
  // 为所有基准指数设置默认时间信息，确保即使获取不到数据也能显示时间
  Object.values(BENCH).forEach(benchDef => {
    if (Array.isArray(benchDef)) {
      benchDef.forEach(b => {
        if (!indexTimes[b.tq]) {
          const now = new Date();
          const year = now.getFullYear();
          const month = String(now.getMonth() + 1).padStart(2, '0');
          const day = String(now.getDate()).padStart(2, '0');
          const hour = String(now.getHours()).padStart(2, '0');
          const minute = String(now.getMinutes()).padStart(2, '0');
          indexTimes[b.tq] = `${year}-${month}-${day} ${hour}:${minute}`;
        }
      });
    } else if (benchDef) {
      if (!indexTimes[benchDef]) {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hour = String(now.getHours()).padStart(2, '0');
        const minute = String(now.getMinutes()).padStart(2, '0');
        indexTimes[benchDef] = `${year}-${month}-${day} ${hour}:${minute}`;
      }
    }
  });
  
  // 指数降级逻辑（v28新增）
  // hkHSMI降级：若腾讯返回数据无效则回落到hkHSI（恒生综合中型股指数代码待验证）
  if (indexData['hkHSMI'] == null || indexData['hkHSMI'] === 0) {
    if (indexData['hkHSI'] != null) {
      indexData['hkHSMI'] = indexData['hkHSI'];
    }
  }
  // hkHSCI降级：恒生综合指数（160322基准），若腾讯无此代码则回落到hkHSI近似
  if (indexData['hkHSCI'] == null || indexData['hkHSCI'] === 0) {
    if (indexData['hkHSI'] != null) {
      indexData['hkHSCI'] = indexData['hkHSI'];
    }
  }
  // hkHSSI降级：恒生综合小型股指数（161124基准），腾讯不支持此代码，回落到hkHSI近似
  if (indexData['hkHSSI'] == null || indexData['hkHSSI'] === 0) {
    if (indexData['hkHSI'] != null) {
      indexData['hkHSSI'] = indexData['hkHSI'];
    }
  }
  
  // 更新基金数据
  fundData.forEach(fund => {
    const marketData = tencentData.funds[fund.code];
    if (marketData) {
      fund.price = marketData.price;
      fund.prevClose = marketData.prevClose;
      fund.change = marketData.change;
      fund.volume = marketData.volume;
      
      // 计算实时估值和溢价率
      // 支持混合基准：BENCH[code] 可以是字符串或 [{tq,w}] 数组
      const baseNav = fund.officialNav || fund.prevClose;
      const benchDef = BENCH[fund.code];
      let benchChgPct = 0;
      
      if (Array.isArray(benchDef)) {
        // 混合基准：加权平均
        let totalW = 0;
        benchDef.forEach(b => {
          const chg = indexData[b.tq] || 0;
          benchChgPct += chg * b.w;
          totalW += b.w;
        });
        if (totalW > 0) benchChgPct /= totalW;
      } else if (benchDef) {
        benchChgPct = indexData[benchDef] || 0;
      }
      
      if (baseNav > 0) {
        fund.nav = baseNav * (1 + benchChgPct / 100);
        fund.navChange = benchChgPct;
        fund.premium = (fund.price - fund.nav) / fund.nav * 100;
      }
    }
  });
  
  // 立即渲染表格（市场数据已到，净值数据后台加载中）
  renderTable();
  updateGenerateTime();
  
  // 等待净值数据加载完成（最多15秒），然后重新渲染
  Promise.race([
    navPromise,
    new Promise(r => setTimeout(r, 15000))
  ]).then(() => {
    // 净值数据就绪后重新计算溢价率并渲染
    fundData.forEach(fund => {
      const marketData = fund.price ? { price: fund.price, prevClose: fund.prevClose } : null;
      if (marketData) {
        const baseNav = fund.officialNav || fund.prevClose;
        const benchDef = BENCH[fund.code];
        let benchChgPct = 0;
        if (Array.isArray(benchDef)) {
          let totalW = 0;
          benchDef.forEach(b => { const chg = indexData[b.tq] || 0; benchChgPct += chg * b.w; totalW += b.w; });
          if (totalW > 0) benchChgPct /= totalW;
        } else if (benchDef) { benchChgPct = indexData[benchDef] || 0; }
        if (baseNav > 0) {
          fund.nav = baseNav * (1 + benchChgPct / 100);
          fund.navChange = benchChgPct;
          fund.premium = (fund.price - fund.nav) / fund.nav * 100;
        }
      }
    });
    renderTable();
    updateGenerateTime();
  });
  
  // 解锁刷新锁（市场数据渲染完成即解锁）
  isRefreshing = false;
}

// 排序表格
function sortTable(column) {
  // 移除所有排序标记
  document.querySelectorAll('th.sorted').forEach(th => th.classList.remove('sorted'));
  
  // 设置当前排序列
  const th = document.querySelector(`th[onclick="sortTable('${column}')"]`);
  th.classList.add('sorted');
  
  // 切换排序方向
  if (sortColumn === column) {
    sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
  } else {
    sortColumn = column;
    sortDirection = 'desc';
  }
  
  // 渲染表格
  renderTable();
}

// 渲染表格
function renderTable() {
  // 筛选数据
  let filteredData = [...fundData];
  
  // 按类别筛选
  if (currentCategory !== 'all') {
    filteredData = filteredData.filter(fund => fund.category === currentCategory);
  }
  
  // 按状态筛选
  const threshold = 2; // 固定套利阈值为2%
  switch (currentFilter) {
    case 'arbitrage':
      filteredData = filteredData.filter(fund => {
        if (fund.premium === null) return false;
        // 溢价≥2%且未暂停申购
        if (fund.premium >= threshold && fund.quota !== '暂停') return true;
        // 折价≥2% 任何基金都算套利机会
        if (fund.premium <= -threshold) return true;
        return false;
      });
      break;
    case 'premium':
      filteredData = filteredData.filter(fund => 
        fund.premium !== null && fund.premium > 0
      );
      break;
    case 'discount':
      filteredData = filteredData.filter(fund => 
        fund.premium !== null && fund.premium < 0
      );
      break;
  }
  
  // 电脑版排序
  const desktopSortedData = filteredData.sort((a, b) => {
    let valueA, valueB;
    
    switch (sortColumn) {
      case 'index':
        return sortDirection === 'asc' ? 1 : -1;
      case 'name':
        valueA = a.name;
        valueB = b.name;
        break;
      case 'code':
        valueA = a.code;
        valueB = b.code;
        break;
      case 'category':
        valueA = a.category;
        valueB = b.category;
        break;
      case 'nav':
        valueA = a.nav || 0;
        valueB = b.nav || 0;
        break;
      case 'officialNav':
        valueA = a.officialNav || 0;
        valueB = b.officialNav || 0;
        break;
      case 'price':
        valueA = a.price || 0;
        valueB = b.price || 0;
        break;
      case 'premium':
        valueA = a.premium || 0;
        valueB = b.premium || 0;
        break;
      case 'quota':
        valueA = a.quota;
        valueB = b.quota;
        break;
      default:
        return 0;
    }
    
    if (typeof valueA === 'string' && typeof valueB === 'string') {
      return sortDirection === 'asc' ? valueA.localeCompare(valueB) : valueB.localeCompare(valueA);
    } else {
      return sortDirection === 'asc' ? valueA - valueB : valueB - valueA;
    }
  });
  
  // 渲染电脑版表格
  renderDesktopTable(desktopSortedData);
  
  // 更新统计栏
  updateStats();
}

// 更新顶部统计栏
function updateStats() {
  const total = fundData.length;
  const premiumCount = fundData.filter(f => f.premium !== null && f.premium > 0).length;
  const discountCount = fundData.filter(f => f.premium !== null && f.premium < 0).length;
  const arbitrageCount = fundData.filter(f => {
    if (f.premium === null) return false;
    // 溢价≥2%且未暂停申购
    if (f.premium >= 2 && f.quota !== '暂停') return true;
    // 折价≥2% 任何基金都算套利机会
    if (f.premium <= -2) return true;
    return false;
  }).length;
  
  const el = id => document.getElementById(id);
  if (el('statTotal')) el('statTotal').textContent = total;
  if (el('statPremium')) el('statPremium').textContent = premiumCount;
  if (el('statDiscount')) el('statDiscount').textContent = discountCount;
  if (el('statArbitrage')) el('statArbitrage').textContent = arbitrageCount;
}

let currentChartFund = null;

// 打开净值曲线模态窗口
async function openNavChart(code) {
  const fund = FUNDS.find(f => f.code === code);
  if (!fund) return;
  currentChartFund = code;
  document.getElementById('modalFundName').textContent = fund.name;
  document.getElementById('modalFundCode').textContent = code;
  // 重置 modalBody 为初始结构，防止上次 innerHTML 替换导致 canvas 丢失
  document.getElementById('modalBody').innerHTML = '<div class="modal-loading" id="modalLoading">加载净值数据...</div><canvas id="navChartCanvas" style="display:none"></canvas>';
  document.getElementById('modalLegend').style.display = 'none';
  document.getElementById('modalNote').style.display = 'block';
  document.getElementById('navChartModal').classList.add('active');

  try {
    // 从 Pages Function API 获取历史数据
    // 注意：GitHub Pages 不支持 Pages Functions，需访问 CF Pages 部署的站点
    const historyUrl = '/api/nav-history?code=' + code;
    const res = await fetch(historyUrl);

    // 检查响应类型，防止收到 HTML 页面（如 GitHub Pages 404）
    const contentType = res.headers.get('content-type') || '';
    if (!contentType.includes('application/json')) {
      throw new Error('API不可用，请在 Cloudflare Pages 站点访问');
    }

    const data = await res.json();
    document.getElementById('modalLoading').style.display = 'none';

    if (!data || data.length === 0) {
      document.getElementById('modalBody').innerHTML = '<div class="modal-no-data">暂无净值历史数据，收盘后自动记录</div>';
      document.getElementById('modalLegend').style.display = 'none';
      document.getElementById('modalNote').style.display = 'none';
      return;
    }

    // 恢复模态窗口内容
    document.getElementById('modalBody').innerHTML = '<canvas id="navChartCanvas"></canvas>';
    document.getElementById('modalLegend').style.display = 'flex';
    document.getElementById('modalNote').style.display = 'block';
    const canvas = document.getElementById('navChartCanvas');
    canvas.style.display = 'block';

    // 等 DOM 更新后绘制
    requestAnimationFrame(() => drawNavChart(canvas, data, fund.name));
  } catch (e) {
    document.getElementById('modalLoading').textContent = '加载失败: ' + e.message;
    console.error('[ERROR] 加载净值历史:', e);
  }
}

// 绘制净值曲线图
function drawNavChart(canvas, data, fundName) {
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const W = rect.width - 20;
  const H = Math.max(300, rect.height - 10);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const pad = { top: 30, bottom: 40, left: 55, right: 25 };
  const chartW = W - pad.left - pad.right;
  const chartH = H - pad.top - pad.bottom;

  // 提取数据
  const dates = data.map(d => d.date.slice(5)); // MM-DD
  const estNavs = data.map(d => d.estNav);
  const actualNavs = data.map(d => d.actualNav);

  // 计算 Y 轴范围
  const allVals = [];
  estNavs.forEach(v => { if (v != null) allVals.push(v); });
  actualNavs.forEach(v => { if (v != null) allVals.push(v); });
  if (allVals.length === 0) return;

  let yMin = Math.min(...allVals);
  let yMax = Math.max(...allVals);
  const yRange = yMax - yMin;
  const yPadding = yRange * 0.1 || 0.01;
  yMin -= yPadding;
  yMax += yPadding;

  // X/Y 轴映射
  const xScale = (i) => pad.left + (i / (dates.length - 1 || 1)) * chartW;
  const yScale = (v) => pad.top + chartH - ((v - yMin) / (yMax - yMin)) * chartH;

  // 清空
  ctx.clearRect(0, 0, W, H);

  // 背景网格
  ctx.strokeStyle = 'rgba(148,163,184,0.1)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + (i / 4) * chartH;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(W - pad.right, y);
    ctx.stroke();
  }

  // X 轴标签
  ctx.fillStyle = '#94a3b8';
  ctx.font = '11px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  const labelStep = Math.max(1, Math.floor(dates.length / 7));
  dates.forEach((d, i) => {
    if (i % labelStep === 0 || i === dates.length - 1) {
      ctx.fillText(d, xScale(i), H - pad.bottom + 18);
    }
  });

  // Y 轴标签
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + (i / 4) * chartH;
    const val = yMax - (i / 4) * (yMax - yMin);
    ctx.fillText(val.toFixed(4), pad.left - 8, y);
  }

  // 绘制预估净值线（蓝色）
  ctx.strokeStyle = '#3b82f6';
  ctx.lineWidth = 2;
  ctx.beginPath();
  estNavs.forEach((v, i) => {
    if (v == null) return;
    const x = xScale(i);
    const y = yScale(v);
    if (i === 0 || estNavs[i - 1] == null) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();

  // 预估净值数据点
  ctx.fillStyle = '#3b82f6';
  estNavs.forEach((v, i) => {
    if (v == null) return;
    ctx.beginPath();
    ctx.arc(xScale(i), yScale(v), 3, 0, Math.PI * 2);
    ctx.fill();
  });

  // 绘制实际净值线（橙色）
  const hasActual = actualNavs.some(v => v != null);
  if (hasActual) {
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    actualNavs.forEach((v, i) => {
      if (v == null) return;
      const x = xScale(i);
      const y = yScale(v);
      if (i === 0 || actualNavs[i - 1] == null) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();
    ctx.setLineDash([]);

    // 实际净值数据点
    ctx.fillStyle = '#f59e0b';
    actualNavs.forEach((v, i) => {
      if (v == null) return;
      ctx.beginPath();
      ctx.arc(xScale(i), yScale(v), 3, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  // 图表标题
  ctx.fillStyle = '#e8ecf4';
  ctx.font = '13px -apple-system, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('近15日净值走势', pad.left, 6);
}

// 初始化应用
async function bootstrap() {
  const success = await loadFundsData();
  if (success) {
    init();
  } else {
    console.error('无法加载基金数据，应用初始化失败');
  }
}

bootstrap();
</script>
