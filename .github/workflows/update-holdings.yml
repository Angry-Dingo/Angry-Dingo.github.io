name: Update Fund Holdings & Regression (dev)
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
jobs:
  holdings:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - run: node scripts/update_holdings.js 2>&1 | tee update_holdings_output.log
      - uses: actions/upload-artifact@v4
        with:
          name: holdings-results
          path: |
            data/fund_holdings.json
            data/fund_holdings_regression.json
            update_holdings_output.log
      - run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"
          git add data/fund_holdings.json data/fund_holdings_regression.json
          git diff --cached --quiet || git commit -m "chore: update fund holdings and regression results"
          git push
