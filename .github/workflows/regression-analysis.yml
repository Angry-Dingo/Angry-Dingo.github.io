name: Regression Analysis (Fund Benchmark)
on:
  push:
    branches: [ dev ]
  schedule:
    - cron: '0 22 * * 5'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - run: node scripts/regression_analysis.js 2>&1 | tee regression_output.log
      - uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: |
            data/fund_regression.json
            regression_output.log
      - run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"
          git add data/fund_regression.json
          git diff --cached --quiet || git commit -m "chore: update fund regression analysis results"
          git push
