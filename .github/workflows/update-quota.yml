name: Update Fund Data

on:
  schedule:
    # 工作日早上7:00和下午6:00（北京时间，UTC 23:00 和 10:00）
    - cron: '0 23 * * 0-4'
    - cron: '0 10 * * 1-5'
  # 手动触发
  workflow_dispatch:

jobs:
  update-funds:
    name: Update Fund Data (NAV + Quota)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run fund data update script
        run: node scripts/update_funds.js
      
      - name: Check for changes
        id: check_changes
        run: |
          git diff --name-only
          if git diff --name-only | grep -q "data/funds.json"; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"
          git add data/funds.json
          git commit -m "Update fund data (NAV + quota status)"
          git push
